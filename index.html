<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding Invitation | Sukriti & Sidhant</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600;700&family=Great+Vibes&family=Marcellus&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --teal-primary: #0a424a;
      --teal-dark: #062b31;
      --gold-main: #c59b27;
      --gold-light: #fbeea1;
      --text-dark: #1c2b2e;
      --text-muted: #5a6d70;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      /* Velvet Table Background */
      background: #051d20 url('table_bg.jpg') center/cover no-repeat fixed;
      font-family: 'Marcellus', serif;
      color: var(--text-dark);
      overflow-x: hidden;
    }

    /* Full Page Scroll Snap Container */
    .snap-container {
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scroll-behavior: smooth;
    }

    .section-page {
      height: 100vh;
      width: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      text-align: center;
    }

    /* ==========================================
       INTRO VIDEO OVERLAY
       ========================================== */
    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease, visibility 1s ease;
    }

    #intro-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #tap-to-play {
      position: absolute;
      bottom: 30px;
      color: #fff;
      font-size: 0.85rem;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.7);
      padding: 10px 20px;
      border-radius: 20px;
      border: 1px solid var(--gold-main);
      pointer-events: none;
      animation: pulse 2s infinite;
    }

    /* ==========================================
       REAL PAPER CARD & FRAME LAYOUT
       ========================================== */
    .royal-border-frame {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 820px;
      /* Cotton Paper Texture Background */
      background: #fdfbf7 url('paper_texture.jpg') center/cover repeat;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5), 0 0 20px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3rem 2rem 2.5rem 2rem;
      border-radius: 6px;
      overflow: hidden;
    }

    /* High-Res Arch & Jaali Frame Overlay */
    .frame-overlay {
      position: absolute;
      inset: 0;
      background: url('frame_arch.png') center/100% 100% no-repeat;
      pointer-events: none;
      z-index: 2;
    }

    .card-content {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* ==========================================
       GOLD FOIL TEXT & TYPOGRAPHY
       ========================================== */
    .gold-foil-text {
      background: url('gold_foil.jpg') center/cover repeat;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      filter: drop-shadow(0px 1px 1px rgba(0,0,0,0.15));
    }

    .script-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3.4rem;
      color: var(--teal-primary);
      line-height: 1.1;
    }

    .date-badge {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1.25rem;
      letter-spacing: 2px;
      color: var(--teal-primary);
      border-top: 1px solid var(--gold-main);
      border-bottom: 1px solid var(--gold-main);
      padding: 6px 18px;
      margin: 10px 0;
    }

    .sub-heading {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
    }

    /* ==========================================
       ITINERARY TIMELINE (PAGE 2)
       ========================================== */
    .itinerary-scroll-container {
      width: 100%;
      max-height: 52vh;
      overflow-y: auto;
      padding-right: 5px;
      margin: 10px 0;
    }

    .event-card {
      background: rgba(10, 66, 74, 0.04);
      border-left: 3px solid var(--gold-main);
      border-radius: 4px;
      padding: 10px 14px;
      margin-bottom: 10px;
      text-align: left;
      transition: transform 0.2s ease;
    }

    .event-card:hover {
      transform: translateX(4px);
    }

    .event-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-title {
      font-family: 'Cinzel Decorative', serif;
      font-size: 1rem;
      color: var(--teal-primary);
      font-weight: 700;
    }

    .event-time {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold-light);
      background: var(--teal-dark);
      padding: 2px 8px;
      border-radius: 12px;
    }

    .event-meta {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .venue-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.78rem;
      color: var(--teal-primary);
      text-decoration: underline;
      font-weight: 600;
    }

    /* ==========================================
       COUNTDOWN & BUTTONS
       ========================================== */
    #timer {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .timer-unit {
      background: var(--teal-primary);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      min-width: 48px;
    }

    .timer-unit .num {
      font-size: 1rem;
      font-weight: bold;
      color: var(--gold-light);
    }

    .timer-unit .label {
      font-size: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-action {
      background: var(--teal-primary);
      color: #fff;
      border: 1px solid var(--gold-main);
      padding: 8px 20px;
      font-family: 'Marcellus', serif;
      font-size: 0
